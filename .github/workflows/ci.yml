name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    # Gates the main process (src/main — includes the IPC security layer).
    # DEBT: renderer typecheck (npm run typecheck:renderer) is NOT gated —
    # 155 pre-existing tsc errors (tracked as review issue #7). Gate it once
    # that baseline is burned down to zero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
