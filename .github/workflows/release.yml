name: Release

# Thin caller. Real logic lives in dev-standards.
# Triggered by pushing a v* tag (e.g. `git tag v2.12.5 && git push origin v2.12.5`).
# Schema: https://github.com/Ohio15/dev-standards/blob/main/release/SPEC.md

on:
  push:
    tags: ['v*']

# Repo default-workflow-permissions is `read`. The called workflow needs
# contents: write to publish the GitHub Release; declare it explicitly here
# so the caller-side cap doesn't override the called workflow's declaration.
permissions:
  contents: write

jobs:
  release:
    uses: Ohio15/dev-standards/.github/workflows/electron-release.yml@v1
